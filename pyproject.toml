[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netaudit"
version = "0.1.0"
description = "Audit and document small network labs from device configs"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
netaudit = "netaudit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
