name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest
      - run: pytest -q
      - run: netaudit --links samples/links.txt --html report.html samples/r1.conf samples/r2.conf samples/r3.conf
      - run: netaudit --links samples/links_pt.txt samples/pt_r1.ios samples/pt_r2.ios
      - run: netaudit --explain ACL-MASK
